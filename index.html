<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マイカラオケリスト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32 font-sans select-none">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 overflow-x-auto no-scrollbar">
        <button id="navTabMyList" onclick="switchMainTab('mylist')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow whitespace-nowrap">
          🎤 マイリスト
        </button>
        <button id="navTabRecommend" onclick="switchMainTab('recommend')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white whitespace-nowrap">
          ✨ 昔の名曲発掘
        </button>
        <button id="navTabRanking" onclick="switchMainTab('ranking')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white whitespace-nowrap">
          🔥 流行
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleSetlistDrawer()" class="relative bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
          📋 セトリ
          <span id="setlistBadge" class="hidden bg-indigo-500 text-white rounded-full px-1.5 py-0.2 text-[10px] font-mono">0</span>
        </button>
        <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow flex items-center gap-1 transition shrink-0">
          ＋ 追加
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 1. マイリスト画面 ==================== -->
  <main id="viewMyList" class="max-w-md mx-auto p-4 space-y-3">
    <div id="statusBanner" class="hidden text-xs p-2.5 rounded-xl border"></div>

    <!-- 検索バー -->
    <div class="flex gap-2">
      <input type="text" id="searchInput" oninput="render()" placeholder="曲名・歌手・ジャンル・タグ・音域・メモで検索..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm placeholder:text-slate-600 text-slate-100 focus:outline-none focus:border-indigo-500">
      <button onclick="pickRandom()" class="bg-slate-900 border border-slate-800 px-3.5 py-2.5 rounded-xl text-lg hover:bg-slate-800 transition" title="ランダム選曲">🎲</button>
    </div>

    <!-- 年代別 & キー属性別フィルター -->
    <div class="space-y-1.5">
      <div class="flex gap-1 overflow-x-auto no-scrollbar text-xs" id="decadeTabs">
        <button onclick="setDecadeFilter('all')" class="decade-tab px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium" data-val="all">全年代</button>
        <button onclick="setDecadeFilter('2020s')" class="decade-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800" data-val="2020s">2020年代</button>
        <button onclick="setDecadeFilter('2010s')" class="decade-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800" data-val="2010s">2010年代</button>
        <button onclick="setDecadeFilter('2000s')" class="decade-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800" data-val="2000s">2000年代</button>
        <button onclick="setDecadeFilter('90s')" class="decade-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800" data-val="90s">90年代以前</button>
      </div>

      <!-- キー属性 & デュエットフィルター -->
      <div class="flex gap-1 overflow-x-auto no-scrollbar text-[11px]" id="attrTabs">
        <button onclick="setAttrFilter('all')" class="attr-tab px-2 py-0.5 rounded-md bg-slate-800 text-white font-medium" data-val="all">キー全般</button>
        <button onclick="setAttrFilter('original')" class="attr-tab px-2 py-0.5 rounded-md bg-slate-900 text-slate-400 border border-slate-800" data-val="original">原曲キー</button>
        <button onclick="setAttrFilter('plus')" class="attr-tab px-2 py-0.5 rounded-md bg-slate-900 text-slate-400 border border-slate-800" data-val="plus">＋キー</button>
        <button onclick="setAttrFilter('minus')" class="attr-tab px-2 py-0.5 rounded-md bg-slate-900 text-slate-400 border border-slate-800" data-val="minus">−キー</button>
        <button onclick="setAttrFilter('duet')" class="attr-tab px-2 py-0.5 rounded-md bg-slate-900 text-slate-400 border border-slate-800" data-val="duet">👥 デュエット</button>
      </div>
    </div>

    <!-- ジャンル別フィルター -->
    <div class="space-y-1">
      <div class="text-[10px] text-slate-400 px-1 font-semibold">🎵 ジャンル絞り込み</div>
      <div id="genreFilterList" class="flex gap-1.5 overflow-x-auto no-scrollbar text-xs"></div>
    </div>

    <!-- タグ別フィルター -->
    <div class="space-y-1">
      <div class="text-[10px] text-slate-400 px-1 font-semibold">🏷️ タグ絞り込み</div>
      <div id="tagFilterList" class="flex gap-1.5 overflow-x-auto no-scrollbar text-xs"></div>
    </div>

    <!-- ソート & 完成度フィルター -->
    <div class="flex items-center justify-between gap-2 text-xs pt-1">
      <div class="flex gap-1 overflow-x-auto no-scrollbar py-0.5" id="scoreTabs">
        <button onclick="setScoreFilter('all')" class="score-tab px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium" data-val="all">すべて</button>
        <button onclick="setScoreFilter('得意')" class="score-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800" data-val="得意">得意</button>
        <button onclick="setScoreFilter('歌える')" class="score-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800" data-val="歌える">歌える</button>
        <button onclick="setScoreFilter('練習中')" class="score-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800" data-val="練習中">練習中</button>
      </div>
      <select id="sortSelect" onchange="render()" class="bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-slate-300 focus:outline-none shrink-0 text-[11px]">
        <option value="lastSung">最近歌った順</option>
        <option value="singCount">歌唱回数が多い順 🔥</option>
        <option value="scoreVal">自己ベスト高得点順 🎯</option>
        <option value="releaseYear">リリース年順</option>
        <option value="newest">登録が新しい順</option>
        <option value="title">曲名順 (昇順)</option>
      </select>
    </div>

    <!-- ランダム選曲ポップアップ -->
    <div id="randomBanner" class="hidden bg-indigo-950/90 border border-indigo-500/60 p-4 rounded-2xl relative shadow-xl">
      <div class="text-xs font-bold text-indigo-400 mb-1">🎲 おすすめの1曲！</div>
      <div id="randomTitle" class="text-lg font-bold text-white"></div>
      <div id="randomArtist" class="text-sm text-slate-300"></div>
      <div id="randomMeta" class="text-xs text-indigo-300 mt-1"></div>
      <div id="randomKey" class="mt-2 text-xs font-semibold text-indigo-200"></div>
      <button onclick="closeRandom()" class="absolute top-2.5 right-2.5 text-slate-400 hover:text-white text-xs p-1">✕</button>
    </div>

    <div class="text-[11px] text-slate-400 px-1 flex justify-between">
      <span id="songCount">接続中...</span>
    </div>

    <div id="songList" class="space-y-3"></div>
  </main>

  <!-- ==================== 2. あなたへのおすすめ発掘画面 ==================== -->
  <main id="viewRecommend" class="max-w-md mx-auto p-4 space-y-3.5 hidden">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="font-bold text-base text-white">✨ マイリスト分析 & 昔の名曲発掘</h2>
        <p class="text-[11px] text-slate-400">登録済みアーティストの未登録曲や、よく歌う年代の名曲を発掘</p>
      </div>
      <button onclick="analyzeAndRecommend()" class="text-xs text-indigo-400 bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-lg hover:bg-slate-800">
        🔄 再発掘
      </button>
    </div>

    <!-- 分析サマリー -->
    <div id="recommendInsight" class="bg-indigo-950/40 border border-indigo-900/60 p-3 rounded-xl text-xs text-indigo-200 space-y-1">
      マイリストの傾向を分析中...
    </div>

    <!-- おすすめ曲一覧 -->
    <div id="recommendList" class="space-y-2.5">
      <div class="text-center text-slate-500 py-12 text-sm">おすすめ曲を探索中...</div>
    </div>
  </main>

  <!-- ==================== 3. 流行・ランキング画面 ==================== -->
  <main id="viewRanking" class="max-w-md mx-auto p-4 space-y-3.5 hidden">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="font-bold text-base text-white">🔥 Apple Music 日本トップソング</h2>
        <p class="text-[11px] text-slate-400">ジャケットタップで30秒試聴できます</p>
      </div>
      <button onclick="loadRanking()" class="text-xs text-indigo-400 bg-slate-900 border border-slate-800 px-2.5 py-1.5 rounded-lg hover:bg-slate-800">
        🔄 更新
      </button>
    </div>

    <div id="rankingList" class="space-y-2.5">
      <div class="text-center text-slate-500 py-12 text-sm">ランキングを読み込み中...</div>
    </div>
  </main>

  <!-- セトリ管理ドロワー -->
  <div id="setlistDrawer" class="fixed inset-x-0 bottom-0 z-40 bg-slate-900/98 backdrop-blur border-t border-slate-800 p-4 transform translate-y-full transition-transform duration-300 max-w-md mx-auto rounded-t-2xl shadow-2xl space-y-3">
    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
      <div>
        <div class="flex items-center gap-1.5">
          <span class="text-base">📋</span>
          <h3 class="font-bold text-sm text-white">本日の曲順ルーティン</h3>
        </div>
        <div id="setlistSummary" class="text-[11px] text-indigo-400 font-mono mt-0.5">0曲 • 合計 0分00秒</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="clearSetlist()" class="text-[11px] text-slate-400 hover:text-rose-400">全クリア</button>
        <button onclick="toggleSetlistDrawer()" class="text-slate-400 text-sm p-1">✕</button>
      </div>
    </div>
    <div id="setlistItems" class="max-h-60 overflow-y-auto no-scrollbar space-y-2"></div>
  </div>

  <!-- 追加・編集モーダル -->
  <div id="modal" class="fixed inset-0 z-50 bg-black/75 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl my-auto space-y-3">
      <h2 id="modalTitle" class="text-base font-bold flex items-center gap-1.5 text-white">🎵 曲を登録</h2>
      
      <!-- iTunes自動取得セクション -->
      <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl space-y-2">
        <div class="text-[11px] font-bold text-indigo-400">⚡ iTunesで検索（歌手・曲名から最大50曲）</div>
        <div class="flex gap-1.5">
          <input type="text" id="apiSearchInput" placeholder="歌手名や曲名を入力..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white placeholder:text-slate-600 focus:outline-none">
          <button type="button" onclick="searchITunes()" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold">検索</button>
        </div>
        
        <div id="apiSortRow" class="hidden flex items-center justify-between text-[11px] text-slate-400 pt-1">
          <span id="apiResultCount">0件</span>
          <div class="flex items-center gap-1">
            <span>並び順:</span>
            <select id="apiSortSelect" onchange="renderITunesResults()" class="bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 text-slate-200 text-[10px] focus:outline-none">
              <option value="default">人気・関連度順</option>
              <option value="title">曲名順 (あいうえお)</option>
              <option value="yearDesc">リリース年が新しい順</option>
              <option value="yearAsc">リリース年が古い順</option>
            </select>
          </div>
        </div>

        <div id="apiSearchResults" class="max-h-52 overflow-y-auto no-scrollbar space-y-1.5 hidden"></div>
      </div>

      <form onsubmit="handleSave(event)" class="space-y-3 text-sm">
        <input type="hidden" id="editSongId" value="">
        <input type="hidden" id="formArtwork" value="">
        <input type="hidden" id="formPreviewUrl" value="">
        <input type="hidden" id="formDuration" value="">
        <input type="hidden" id="formDurationMs" value="">
        <input type="hidden" id="formLastSungAt" value="">
        <input type="hidden" id="formSingCount" value="0">

        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block text-xs text-slate-400 mb-1">曲名 *</label>
            <input type="text" id="formTitle" required placeholder="例: 白日" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">リリース年</label>
            <input type="number" id="formYear" placeholder="2019" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">歌手名</label>
            <input type="text" id="formArtist" placeholder="例: King Gnu" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">ジャンル</label>
            <input type="text" id="formGenre" placeholder="例: J-Pop, アニメ, ロック" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- 音域設定 -->
        <div class="grid grid-cols-2 gap-2 bg-slate-950/60 p-2 rounded-xl border border-slate-800/80">
          <div>
            <label class="block text-[11px] text-amber-400 mb-1">🔥 最高音</label>
            <input type="text" id="formMaxPitch" placeholder="例: hiA, mid2G" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] text-sky-400 mb-1">💧 最低音</label>
            <input type="text" id="formMinPitch" placeholder="例: mid1D, lowG" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-1.5 text-xs text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <!-- キー設定 & 精密採点ベストスコア -->
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">キー設定</label>
            <select id="formKey" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none">
              <option value="-6">-6</option>
              <option value="-5">-5</option>
              <option value="-4">-4</option>
              <option value="-3">-3</option>
              <option value="-2">-2</option>
              <option value="-1">-1</option>
              <option value="0" selected>原曲 (0)</option>
              <option value="+1">+1</option>
              <option value="+2">+2</option>
              <option value="+3">+3</option>
              <option value="+4">+4</option>
              <option value="+5">+5</option>
              <option value="+6">+6</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">完成度</label>
            <select id="formScore" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none">
              <option value="得意">得意</option>
              <option value="歌える" selected>歌える</option>
              <option value="練習中">練習中</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-amber-400 mb-1">🎯 ベスト点数</label>
            <input type="number" step="0.001" id="formScoreVal" placeholder="92.5" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">歌唱タイプ</label>
            <select id="formDuetType" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 focus:outline-none">
              <option value="solo" selected>ソロ (通常)</option>
              <option value="duet">👥 デュエット・合唱</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">タグ（カンマ区切り）</label>
            <input type="text" id="formTags" placeholder="盛り上がる, バラード 等" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">メモ（歌い出し・サビ高音など）</label>
          <textarea id="formMemo" rows="2" placeholder="サビのブレス位置、裏声の切り替えなど" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100 placeholder:text-slate-600 resize-none focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div id="resetSungRow" class="hidden pt-1">
          <button type="button" onclick="clearSungHistory()" class="text-xs text-slate-400 hover:text-rose-400 underline">歌唱履歴・回数をクリアする</button>
        </div>

        <div class="flex gap-2 pt-1">
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 text-slate-300 py-2.5 rounded-lg font-bold">キャンセル</button>
          <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg font-bold transition">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase & スクリプト -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyCGxnALF5RNC1RvhE-IOEWDrHNnf4a56r4",
  authDomain: "karaoke-app-7feaf.firebaseapp.com",
  projectId: "karaoke-app-7feaf",
  storageBucket: "karaoke-app-7feaf.firebasestorage.app",
  messagingSenderId: "521842530298",
  appId: "1:521842530298:web:1180dc25027ca21f90f643"
};

    function showStatus(msg, isError = false) {
      const banner = document.getElementById('statusBanner');
      if (!banner) return;
      banner.textContent = msg;
      banner.className = isError 
        ? "text-xs p-2.5 rounded-xl border bg-rose-950/80 border-rose-800 text-rose-300 block mb-3"
        : "text-xs p-2.5 rounded-xl border bg-slate-900 border-slate-800 text-slate-300 block mb-3";
    }

    try {
      if (firebaseConfig.apiKey === "YOUR_API_KEY") {
        showStatus("⚠️ Firebaseの設定が未入力です。firebaseConfigを入力してください。", true);
      } else {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.firestoreOps = { collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy };
        
        const q = query(collection(db, "songs"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
          window.songs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          document.getElementById('statusBanner').classList.add('hidden');
          window.render();
          window.renderSetlist();
        }, (err) => {
          showStatus("⚠️ 通信エラー: " + err.message, true);
        });
      }
    } catch (e) {
      showStatus("⚠️ 初期化エラー: " + e.message, true);
    }
  </script>

  <script>
    window.songs = [];
    let rankingSongs = [];
    let recommendedSongs = [];
    let currentRawITunesResults = [];
    let setlist = JSON.parse(localStorage.getItem('karaoke_setlist')) || [];
    let selectedGenre = null;
    let selectedTag = null;
    let selectedScore = 'all';
    let selectedDecade = 'all';
    let selectedAttr = 'all';
    let currentAudio = null;
    let currentPlayingId = null;
    let undoHistory = {};

    function saveSetlist() {
      localStorage.setItem('karaoke_setlist', JSON.stringify(setlist));
      renderSetlist();
    }

    function checkIsDuet(title, artist) {
      const target = `${title || ''} ${artist || ''}`.toLowerCase();
      const duetPatterns = [
        'feat.', 'feat ', 'featuring',
        'with ', 'with\u3000',
        'duet', 'デュエット', '合唱',
        ' & ', '＆', ' × ', '×', ' / '
      ];
      return duetPatterns.some(pattern => target.includes(pattern));
    }

    window.switchMainTab = function(tab) {
      const btnMyList = document.getElementById('navTabMyList');
      const btnRecommend = document.getElementById('navTabRecommend');
      const btnRanking = document.getElementById('navTabRanking');
      const viewMyList = document.getElementById('viewMyList');
      const viewRecommend = document.getElementById('viewRecommend');
      const viewRanking = document.getElementById('viewRanking');

      const tabs = [
        { id: 'mylist', btn: btnMyList, view: viewMyList },
        { id: 'recommend', btn: btnRecommend, view: viewRecommend },
        { id: 'ranking', btn: btnRanking, view: viewRanking }
      ];

      tabs.forEach(t => {
        if (t.id === tab) {
          t.btn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow whitespace-nowrap";
          t.view.classList.remove('hidden');

          t.view.classList.add('hidden');
        }
      });

      if (tab === 'ranking' && rankingSongs.length === 0) {

        analyzeAndRecommend();
      }
    };

    // ==================== 試聴再生（即時Lookupフォールバック付き） ====================
    window.togglePlayPreview = async function(url, id, trackName = '', artistName = '', trackId = '') {
      if (currentPlayingId === id && currentAudio) {
        currentAudio.pause();
        currentAudio = null;
        currentPlayingId = null;
        renderAllViews();
        return;
      }

      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      let playableUrl = url;

      // URLが無い場合はiTunes Lookup / Searchでリアルタイム解決
      if (!playableUrl && (trackId || (trackName && artistName))) {
        try {
          let queryUrl = '';
          if (trackId) {
            queryUrl = `https://itunes.apple.com/lookup?id=${trackId}&country=jp`;
          } else {
            queryUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(trackName + ' ' + artistName)}&country=jp&entity=song&limit=1`;
          }
          const res = await fetch(queryUrl);
          const data = await res.json();
          if (data.results && data.results.length > 0 && data.results[0].previewUrl) {
            playableUrl = data.results[0].previewUrl;
            // キャッシュ更新
            const rItem = rankingSongs.find(r => `ranking_${r.rank}` === id);
            if (rItem) rItem.previewUrl = playableUrl;
            const recItem = recommendedSongs.find((r, idx) => `rec_${idx}` === id);
            if (recItem) recItem.previewUrl = playableUrl;
          }
        } catch (e) {
          console.error("Preview resolve error:", e);
        }
      }

      if (!playableUrl) {
        alert("⚠️ この楽曲の試聴音源は見つかりませんでした");
        return;
      }

      currentAudio = new Audio(playableUrl);
      currentPlayingId = id;
      currentAudio.play().catch(e => {
        console.error("Playback failed:", e);
        currentPlayingId = null;
        renderAllViews();
      });

      currentAudio.onended = () => {
        currentPlayingId = null;
        renderAllViews();
      };

      renderAllViews();
    };

    function renderAllViews() {
      render();
      renderRanking();
      renderRecommended();
    }

    // ==================== ランキング取得・描画 ====================
    window.loadRanking = async function() {
      const container = document.getElementById('rankingList');
      container.innerHTML = '<div class="text-center text-slate-500 py-12 text-sm">ランキングを取得中...</div>';
      try {
        const res = await fetch('https://itunes.apple.com/jp/rss/topsongs/limit=50/json');
        const data = await res.json();
        const entries = data.feed.entry || [];
        
        rankingSongs = entries.map((entry, idx) => {
          const title = entry['im:name'] ? entry['im:name'].label : '';
          const artist = entry['im:artist'] ? entry['im:artist'].label : '';
          const artwork = entry['im:image'] && entry['im:image'].length > 2 ? entry['im:image'][2].label : '';
          const releaseDate = entry['im:releaseDate'] ? entry['im:releaseDate'].label : '';
          const year = releaseDate ? releaseDate.substring(0, 4) : '';
          const genre = entry.category && entry.category.attributes ? entry.category.attributes.label : 'J-Pop';
          const trackId = entry.id && entry.id.attributes ? entry.id.attributes['im:id'] : '';
          
          let previewUrl = '';
          if (entry.link) {
            // link配列の中からpreview属性またはプレビューm4aを探す
            const links = Array.isArray(entry.link) ? entry.link : [entry.link];
            const pLink = links.find(l => (l.attributes && (l.attributes.title === 'Preview' || (l.attributes.href && l.attributes.href.includes('.m4a')))));
            if (pLink) previewUrl = pLink.attributes.href;
          }

          return { rank: idx + 1, trackId, title, artist, artwork, year, genre, previewUrl };
        });

        renderRanking();
      } catch (e) {
        container.innerHTML = '<div class="text-center text-rose-400 py-12 text-sm">ランキングの取得に失敗しました</div>';
      }
    };

    // ==================== マイリスト分析 & 昔の名曲発掘ロジック ====================
    window.analyzeAndRecommend = async function() {
      const insightEl = document.getElementById('recommendInsight');
      const listEl = document.getElementById('recommendList');

      if (!window.songs || window.songs.length === 0) {
        insightEl.innerHTML = 'マイリストに曲が登録されていません。まずは好きな曲をいくつか登録してください！';
        listEl.innerHTML = '<div class="text-center text-slate-500 py-12 text-sm">マイリストが空です</div>';
        return;
      }

      insightEl.innerHTML = 'マイリストの歌手・年代プロファイルを解析して候補を探索中...';
      listEl.innerHTML = '<div class="text-center text-slate-500 py-12 text-sm">昔の名曲・関連曲を発掘中...</div>';

      // 1. アーティスト出現頻度集計
      const artistCounts = {};
      const decadeCounts = { '90s': 0, '2000s': 0, '2010s': 0, '2020s': 0 };

      window.songs.forEach(s => {
        if (s.artist) {
          const mainArtist = s.artist.split(/[,&×/feat.]+/i)[0].trim();
          if (mainArtist) artistCounts[mainArtist] = (artistCounts[mainArtist] || 0) + 1;
        }
        const yr = parseInt(s.year, 10);
        if (yr) {
          if (yr < 2000) decadeCounts['90s']++;
          else if (yr < 2010) decadeCounts['2000s']++;
          else if (yr < 2020) decadeCounts['2010s']++;
          else decadeCounts['2020s']++;
        }
      });

      // 上位アーティスト（最大3組）
      const topArtists = Object.keys(artistCounts).sort((a, b) => artistCounts[b] - artistCounts[a]).slice(0, 3);
      // 最多年代
      const topDecade = Object.keys(decadeCounts).reduce((a, b) => decadeCounts[a] > decadeCounts[b] ? a : b);
      const decadeLabel = { '90s': '90年代以前', '2000s': '2000年代', '2010s': '2010年代', '2020s': '2020年代' }[topDecade];

      insightEl.innerHTML = `
        <div class="font-bold text-indigo-300">💡 あなたのカラオケプロファイル</div>
        <div>よく歌う歌手: <strong class="text-white">${topArtists.join(', ') || '未特定'}</strong></div>
        <div>中心年代: <strong class="text-white">${decadeLabel}</strong>（昔よく聴いた曲を優先発掘）</div>
      `;

      // 2. iTunes API から上位アーティストの代表曲・同年代曲を取得
      const fetchedCandidates = [];
      const myTitles = new Set(window.songs.map(s => (s.title || '').toLowerCase().replace(/\s+/g, '')));

      for (const artist of topArtists) {
        try {
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(artist)}&country=jp&entity=song&limit=15`);
          const data = await res.json();
          if (data.results) {
            data.results.forEach(item => {
              const cleanedTitle = (item.trackName || '').toLowerCase().replace(/\s+/g, '');
              if (!myTitles.has(cleanedTitle)) {
                fetchedCandidates.push({
                  title: item.trackName,
                  artist: item.artistName,
                  year: item.releaseDate ? item.releaseDate.substring(0, 4) : '',
                  genre: item.primaryGenreName || 'J-Pop',
                  artwork: item.artworkUrl100 || '',
                  previewUrl: item.previewUrl || '',
                  durationMs: item.trackTimeMillis || 0,
                  reason: `好きな歌手「${artist}」の未登録人気曲`
                });
              }
            });
          }
        } catch (e) {
          console.error(e);
        }
      }

      // 重複除去 & シャッフル
      const uniqueMap = new Map();
      fetchedCandidates.forEach(c => {
        const k = `${c.title}_${c.artist}`.toLowerCase();
        if (!uniqueMap.has(k)) uniqueMap.set(k, c);
      });

      recommendedSongs = Array.from(uniqueMap.values())
        .sort(() => 0.5 - Math.random())
        .slice(0, 20);

      renderRecommended();
    };

    function renderRecommended() {

    // ==================== モーダル・iTunes検索・データ追加 ====================
    window.addFromRanking = function(encoded) {
      const data = JSON.parse(decodeURIComponent(encoded));
      openModal();
      document.getElementById('formTitle').value = data.title;
      document.getElementById('formArtist').value = data.artist;
      document.getElementById('formYear').value = data.year;
      document.getElementById('formGenre').value = data.genre;
      document.getElementById('formArtwork').value = data.artwork;
      document.getElementById('formPreviewUrl').value = data.previewUrl;
      
      const isDuet = checkIsDuet(data.title, data.artist);
      document.getElementById('formDuetType').value = isDuet ? 'duet' : 'solo';

      const yr = parseInt(data.year, 10);
      const tags = [];
      if (yr >= 2020) tags.push('2020年代');
      else if (yr >= 2010) tags.push('2010年代');
      else if (yr >= 2000) tags.push('2000年代');
      else if (yr < 2000) tags.push('90年代以前');
      tags.push('発掘・おすすめ');
      document.getElementById('formTags').value = tags.join(', ');
    };

    window.searchITunes = async function() {
      const term = document.getElementById('apiSearchInput').value.trim();
      const resultBox = document.getElementById('apiSearchResults');
      const sortRow = document.getElementById('apiSortRow');
      if (!term) return;

      resultBox.classList.remove('hidden');
      sortRow.classList.add('hidden');
      resultBox.innerHTML = '<div class="text-[11px] text-slate-500 py-1">50件取得中...</div>';

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&country=jp&entity=song&limit=50`);
        const data = await res.json();
        if (!data.results || data.results.length === 0) {
          resultBox.innerHTML = '<div class="text-[11px] text-slate-500 py-1">曲が見つかりませんでした</div>';
          return;
        }

        currentRawITunesResults = data.results.map(item => {
          const year = item.releaseDate ? item.releaseDate.substring(0, 4) : '';
          const mins = Math.floor((item.trackTimeMillis || 0) / 60000);
          const secs = Math.floor(((item.trackTimeMillis || 0) % 60000) / 1000).toString().padStart(2, '0');
          const duration = item.trackTimeMillis ? `${mins}:${secs}` : '';
          const isDuet = checkIsDuet(item.trackName, item.artistName);

          const tags = [];
          const yr = parseInt(year, 10);
          if (yr >= 2020) tags.push('2020年代');
          else if (yr >= 2010) tags.push('2010年代');
          else if (yr >= 2000) tags.push('2000年代');
          else if (yr < 2000) tags.push('90年代以前');

          if (item.trackTimeMillis && item.trackTimeMillis < 190000) tags.push('短め');
          else if (item.trackTimeMillis && item.trackTimeMillis > 300000) tags.push('長尺');

          return {
            title: item.trackName,
            artist: item.artistName,
            year: year,
            genre: item.primaryGenreName || 'J-Pop',
            artwork: item.artworkUrl100 || '',
            previewUrl: item.previewUrl || '',
            duration: duration,
            durationMs: item.trackTimeMillis || 0,
            isDuet: isDuet,
            tags: tags
          };
        });

        sortRow.classList.remove('hidden');
        renderITunesResults();
      } catch (e) {
        resultBox.innerHTML = '<div class="text-[11px] text-rose-400 py-1">検索に失敗しました</div>';
      }
    };

    window.renderITunesResults = function() {
      const resultBox = document.getElementById('apiSearchResults');
      const sortMode = document.getElementById('apiSortSelect').value;
      const countEl = document.getElementById('apiResultCount');
      
      let list = [...currentRawITunesResults];
      if (sortMode === 'title') {
        list.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
      } else if (sortMode === 'yearDesc') {
        list.sort((a, b) => (parseInt(b.year, 10) || 0) - (parseInt(a.year, 10) || 0));
      } else if (sortMode === 'yearAsc') {
        list.sort((a, b) => (parseInt(a.year, 10) || 0) - (parseInt(b.year, 10) || 0));
      }

      countEl.textContent = `${list.length}件の曲`;

      resultBox.innerHTML = list.map(item => {
        const rawItem = encodeURIComponent(JSON.stringify(item));
        return `
          <div onclick="selectITunesSong('${rawItem}')" class="flex items-center gap-2.5 p-2 hover:bg-slate-900 rounded-xl cursor-pointer border border-slate-800 transition">
            <img src="${item.artwork || ''}" class="w-10 h-10 rounded-lg object-cover shrink-0 bg-slate-800 shadow">

              <div class="text-xs font-bold text-white truncate flex items-center gap-1.5">

            </div>

    // ==================== セトリ管理 ====================
    window.toggleSetlistDrawer = function() {
      document.getElementById('setlistDrawer').classList.toggle('translate-y-full');
    };

    window.addToSetlist = function(id) {

        saveSetlist();
      }
      document.getElementById('setlistDrawer').classList.remove('translate-y-full');
    };

      setlist = setlist.filter(x => x !== id);
      saveSetlist();
    };

    window.moveSetlistItem = function(idx, direction) {
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= setlist.length) return;
      const temp = setlist[idx];
      setlist[idx] = setlist[targetIdx];
      setlist[targetIdx] = temp;
      saveSetlist();
    };

    window.clearSetlist = function() {
      if (confirm('歌う曲順セトリをすべてクリアしますか？')) {
        setlist = [];
        saveSetlist();
      }
    };

    window.renderSetlist = function() {
      const countEl = document.getElementById('setlistBadge');
      const summaryEl = document.getElementById('setlistSummary');
      const container = document.getElementById('setlistItems');

      if (setlist.length > 0) {
        countEl.textContent = setlist.length;
        countEl.classList.remove('hidden');

        let totalMs = 0;
        setlist.forEach(id => {
          const s = (window.songs || []).find(x => x.id === id);
          if (s) {
            totalMs += (s.durationMs || 240000);
          }
        });
        const totalMins = Math.floor(totalMs / 60000);
        const totalSecs = Math.floor((totalMs % 60000) / 1000).toString().padStart(2, '0');
        summaryEl.textContent = `${setlist.length}曲 • 合計 約${totalMins}分${totalSecs}秒`;

        countEl.classList.add('hidden');
        summaryEl.textContent = '0曲 • 合計 0分00秒';

        return;

              <span class="font-mono font-bold text-indigo-400 w-4 text-center shrink-0">${idx + 1}</span>

            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="moveSetlistItem(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-30 p-1"' : 'class="text-slate-400 hover:text-white p-1"'}>▲</button>
              <button onclick="moveSetlistItem(${idx}, 1)" ${idx === setlist.length - 1 ? 'disabled class="opacity-30 p-1"' : 'class="text-slate-400 hover:text-white p-1"'}>▼</button>
              <button onclick="recordSung('${s.id}'); removeFromSetlist('${s.id}')" class="bg-indigo-900/60 hover:bg-indigo-900 border border-indigo-700/60 text-indigo-200 px-2 py-0.5 rounded text-[10px] ml-1">
                歌った!
              </button>
              <button onclick="removeFromSetlist('${s.id}')" class="text-slate-500 hover:text-rose-400 p-1">✕</button>
            </div>
          </div>
        `;
      }).join('');
    };

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // ==================== マイリスト描画 ====================
    window.render = function() {
      const queryStr = document.getElementById('searchInput').value.toLowerCase();
      const sortMode = document.getElementById('sortSelect').value;

      let filtered = (window.songs || []).filter(s => {
        const matchesQuery = (s.title || '').toLowerCase().includes(queryStr) || 
                             (s.artist || '').toLowerCase().includes(queryStr) ||
                             (s.memo || '').toLowerCase().includes(queryStr) ||
                             (s.genre || '').toLowerCase().includes(queryStr) ||
                             (s.maxPitch || '').toLowerCase().includes(queryStr) ||
                             (s.minPitch || '').toLowerCase().includes(queryStr) ||
                             (s.year ? s.year.toString().includes(queryStr) : false) ||
                             (s.tags && s.tags.some(t => t.toLowerCase().includes(queryStr)));
        
        const matchesGenre = selectedGenre ? s.genre === selectedGenre : true;
        const matchesTag = selectedTag ? s.tags && s.tags.includes(selectedTag) : true;
        const matchesScore = selectedScore === 'all' ? true : s.score === selectedScore;
        
        let matchesDecade = true;
        const yr = parseInt(s.year, 10);
        if (selectedDecade === '2020s') matchesDecade = yr >= 2020;
        else if (selectedDecade === '2010s') matchesDecade = yr >= 2010 && yr <= 2019;
        else if (selectedDecade === '2000s') matchesDecade = yr >= 2000 && yr <= 2009;
        else if (selectedDecade === '90s') matchesDecade = yr < 2000;

        let matchesAttr = true;
        if (selectedAttr === 'original') matchesAttr = s.key === '0';
        else if (selectedAttr === 'plus') matchesAttr = (s.key || '').startsWith('+');
        else if (selectedAttr === 'minus') matchesAttr = (s.key || '').startsWith('-');
        else if (selectedAttr === 'duet') matchesAttr = s.duetType === 'duet';

        return matchesQuery && matchesGenre && matchesTag && matchesScore && matchesDecade && matchesAttr;
      });

      filtered.sort((a, b) => {
        if (sortMode === 'lastSung') return (b.lastSungAt || 0) - (a.lastSungAt || 0);
        if (sortMode === 'singCount') return (b.singCount || 0) - (a.singCount || 0);
        if (sortMode === 'scoreVal') return (parseFloat(b.scoreVal) || 0) - (parseFloat(a.scoreVal) || 0);
        if (sortMode === 'releaseYear') return (parseInt(b.year, 10) || 0) - (parseInt(a.year, 10) || 0);
        if (sortMode === 'title') return (a.title || '').localeCompare(b.title || '', 'ja');
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      // ジャンル別フィルター
      const allGenres = Array.from(new Set((window.songs || []).map(s => s.genre).filter(Boolean)));
      const genreContainer = document.getElementById('genreFilterList');
      genreContainer.innerHTML = '';
      if (allGenres.length > 0) {
        genreContainer.innerHTML += `<button onclick="setFilterGenre(null)" class="px-2.5 py-0.5 rounded-full whitespace-nowrap transition ${selectedGenre === null ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-900 text-slate-400 border border-slate-800'}">全ジャンル</button>`;
        allGenres.forEach(g => {
          genreContainer.innerHTML += `<button onclick="setFilterGenre('${g}')" class="px-2.5 py-0.5 rounded-full whitespace-nowrap transition ${selectedGenre === g ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-900 text-slate-400 border border-slate-800'}">${escapeHtml(g)}</button>`;
        });
      }

      // タグ別フィルター
      const allTags = Array.from(new Set((window.songs || []).flatMap(s => s.tags || [])));
      const tagContainer = document.getElementById('tagFilterList');
      tagContainer.innerHTML = '';
      if (allTags.length > 0) {
        tagContainer.innerHTML += `<button onclick="setFilterTag(null)" class="px-2.5 py-0.5 rounded-full whitespace-nowrap transition ${selectedTag === null ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-900 text-slate-400 border border-slate-800'}">全タグ</button>`;
        allTags.forEach(tag => {
          tagContainer.innerHTML += `<button onclick="setFilterTag('${tag}')" class="px-2.5 py-0.5 rounded-full whitespace-nowrap transition ${selectedTag === tag ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-900 text-slate-400 border border-slate-800'}">#${tag}</button>`;
        });
      }

      document.getElementById('songCount').textContent = `登録曲: ${filtered.length}曲 / 全${(window.songs || []).length}曲`;

      const listContainer = document.getElementById('songList');
      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="text-center text-slate-500 py-12 text-sm">該当する曲がありません</div>';
        return;
      }

      listContainer.innerHTML = filtered.map(s => {
        const isPlaying = currentPlayingId === s.id;
        const lyricsSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(s.title + ' ' + (s.artist || '') + ' 歌詞')}`;
        const hasUndo = undoHistory[s.id] !== undefined;
        const inSetlist = setlist.includes(s.id);

        return `
          <div class="bg-slate-900/90 border border-slate-800 p-3.5 rounded-2xl flex flex-col gap-2.5 shadow-sm">
            <div class="flex items-start gap-3">
              ${s.artwork ? `
                <img src="${s.artwork}" class="w-14 h-14 rounded-xl object-cover shrink-0 bg-slate-800 shadow border border-slate-800/80">
              ` : `
                <div class="w-14 h-14 rounded-xl bg-slate-800 border border-slate-800/80 flex items-center justify-center shrink-0 text-xl text-slate-600">🎵</div>
              `}

              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-start gap-1">
                  <div class="font-bold text-base text-white truncate">${escapeHtml(s.title)}</div>
                  <div class="flex items-center gap-1 shrink-0">
                    <span class="text-xs px-2 py-0.5 rounded-md font-mono font-bold ${
                      s.key === '0' ? 'bg-slate-800 text-slate-300 border border-slate-700' :
                      (s.key || '').startsWith('+') ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                      'bg-blue-950 text-blue-300 border border-blue-800'
                    }">${s.key === '0' ? '原曲' : 'キー ' + s.key}</span>
                    <button onclick="openEditModal('${s.id}')" class="text-slate-400 hover:text-indigo-400 p-1 text-xs">✏️</button>
                    <button onclick="deleteSong('${s.id}')" class="text-slate-500 hover:text-rose-400 p-1 text-xs">🗑️</button>
                  </div>
                </div>

                <div class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(s.artist) || '歌手未設定'}</div>

                <!-- メタ情報バッジ -->
                <div class="flex items-center gap-1.5 flex-wrap mt-1 text-[10px]">
                  <span class="px-1.5 py-0.5 rounded font-medium ${
                    s.score === '得意' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/80' :
                    s.score === '歌える' ? 'bg-sky-950 text-sky-400 border border-sky-800/80' :
                    'bg-amber-950 text-amber-400 border border-amber-800/80'
                  }">${s.score}</span>
                  ${s.scoreVal ? `<span class="bg-amber-950/80 text-amber-300 px-1.5 py-0.5 rounded border border-amber-700/80 font-bold font-mono">🎯 ${s.scoreVal}点</span>` : ''}
                  ${s.singCount ? `<span class="bg-indigo-950/70 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-800/70 font-mono">🔥 ${s.singCount}回歌唱</span>` : ''}
                  ${s.duetType === 'duet' ? `<span class="bg-purple-950 text-purple-300 px-1.5 py-0.5 rounded border border-purple-800">👥 デュエット</span>` : ''}
                  ${s.genre ? `<span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700/60">${escapeHtml(s.genre)}</span>` : ''}
                  ${s.year ? `<span class="bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded border border-slate-700/60 font-mono">${s.year}年</span>` : ''}
                  ${s.maxPitch ? `<span class="bg-amber-950/70 text-amber-300 px-1.5 py-0.5 rounded border border-amber-800/60 font-mono">最高 ${escapeHtml(s.maxPitch)}</span>` : ''}
                  ${s.minPitch ? `<span class="bg-sky-950/70 text-sky-300 px-1.5 py-0.5 rounded border border-sky-800/60 font-mono">最低 ${escapeHtml(s.minPitch)}</span>` : ''}
                </div>
              </div>
            </div>

            ${s.memo ? `<div class="text-xs text-slate-300 bg-slate-950/70 p-2 rounded-lg border border-slate-800/60 leading-relaxed">${escapeHtml(s.memo)}</div>` : ''}

            <!-- アクションバー -->
            <div class="flex items-center justify-between pt-1 gap-2 border-t border-slate-800/50 text-[11px]">
              <div class="flex items-center gap-1.5">
                <button onclick="recordSung('${s.id}')" class="text-indigo-400 hover:text-indigo-300 bg-indigo-950/50 hover:bg-indigo-950 border border-indigo-900/60 px-2 py-0.5 rounded-md font-medium transition">
                  🎤 歌った！
                </button>
                ${hasUndo ? `
                  <button onclick="undoSung('${s.id}')" class="text-amber-400 hover:text-amber-300 bg-amber-950/60 border border-amber-800/80 px-1.5 py-0.5 rounded-md font-medium text-[10px]">
                    ↩ 取消
                  </button>
                ` : ''}
                <button onclick="${inSetlist ? `removeFromSetlist('${s.id}')` : `addToSetlist('${s.id}')`}" class="text-[10px] px-2 py-0.5 rounded-md font-medium border transition ${inSetlist ? 'bg-indigo-900/80 border-indigo-600 text-indigo-200' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-white'}">
                  ${inSetlist ? '✓ セトリ中' : '＋ セトリ'}
                </button>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="togglePlayPreview('${s.previewUrl || ''}', '${s.id}', '${escapeHtml(s.title)}', '${escapeHtml(s.artist)}')" class="text-xs px-2 py-0.5 rounded-md font-medium border flex items-center gap-1 ${isPlaying ? 'bg-rose-900 border-rose-700 text-rose-200' : 'bg-slate-800 border-slate-700 text-slate-300'}">
                  ${isPlaying ? '⏹ 停止' : '▶ 試聴'}
                </button>
                <a href="${lyricsSearchUrl}" target="_blank" rel="noopener" class="text-slate-400 hover:text-sky-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/60 flex items-center gap-1">
                  📄 歌詞
                </a>
                <a href="https://www.youtube.com/results?search_query=${encodeURIComponent((s.artist ? s.artist + ' ' : '') + s.title)}" target="_blank" rel="noopener" class="text-slate-400 hover:text-red-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/60 flex items-center gap-1">
                  ▶️ YT
                </a>
              </div>
            </div>

            ${s.tags && s.tags.length ? `
              <div class="flex flex-wrap gap-1">
                ${s.tags.map(t => `<span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md">#${escapeHtml(t)}</span>`).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    };

    window.setScoreFilter = function(score) {
      selectedScore = score;
      document.querySelectorAll('.score-tab').forEach(b => {
        b.className = b.dataset.val === score 
          ? 'score-tab px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium' 
          : 'score-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800';
      });
      render();
    };

    window.setDecadeFilter = function(decade) {
      selectedDecade = decade;
      document.querySelectorAll('.decade-tab').forEach(b => {
        b.className = b.dataset.val === decade 
          ? 'decade-tab px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-medium' 
          : 'decade-tab px-2.5 py-1 rounded-lg bg-slate-900 text-slate-400 border border-slate-800';
      });
      render();
    };

    window.setAttrFilter = function(attr) {
      selectedAttr = attr;
      document.querySelectorAll('.attr-tab').forEach(b => {
        b.className = b.dataset.val === attr 
          ? 'attr-tab px-2 py-0.5 rounded-md bg-slate-800 text-white font-medium' 
          : 'attr-tab px-2 py-0.5 rounded-md bg-slate-900 text-slate-400 border border-slate-800';
      });
      render();
    };

    window.setFilterGenre = function(g) {
      selectedGenre = g;
      render();
    };

    window.setFilterTag = function(t) {
      selectedTag = t;
      render();
    };

    window.recordSung = async function(id) {
      if (!window.firestoreOps) return;
      const target = (window.songs || []).find(s => s.id === id);
      if (!target) return;

      undoHistory[id] = {
        lastSungAt: target.lastSungAt || null,
        singCount: target.singCount || 0
      };
      render();

      const nextCount = (target.singCount || 0) + 1;
      const { doc, updateDoc } = window.firestoreOps;
      await updateDoc(doc(window.db, "songs", id), { 
        lastSungAt: Date.now(),
        singCount: nextCount
      });

      setTimeout(() => {
        if (undoHistory[id] !== undefined) {
          delete undoHistory[id];
          render();
        }
      }, 10000);
    };

    window.undoSung = async function(id) {
      if (!window.firestoreOps || undoHistory[id] === undefined) return;
      const prev = undoHistory[id];
      delete undoHistory[id];
      render();

      const { doc, updateDoc } = window.firestoreOps;
      await updateDoc(doc(window.db, "songs", id), { 
        lastSungAt: prev.lastSungAt,
        singCount: prev.singCount
      });
    };

    function resetModalInputs() {
      document.getElementById('editSongId').value = '';
      document.getElementById('formTitle').value = '';
      document.getElementById('formArtist').value = '';
      document.getElementById('formYear').value = '';
      document.getElementById('formGenre').value = '';
      document.getElementById('formMaxPitch').value = '';
      document.getElementById('formMinPitch').value = '';
      document.getElementById('formArtwork').value = '';
      document.getElementById('formPreviewUrl').value = '';
      document.getElementById('formDuration').value = '';
      document.getElementById('formDurationMs').value = '0';
      document.getElementById('formLastSungAt').value = '';
      document.getElementById('formSingCount').value = '0';
      document.getElementById('formScoreVal').value = '';
      document.getElementById('formDuetType').value = 'solo';
      document.getElementById('formKey').value = '0';
      document.getElementById('formScore').value = '歌える';
      document.getElementById('formTags').value = '';
      document.getElementById('formMemo').value = '';
      
      document.getElementById('apiSearchInput').value = '';
      document.getElementById('apiSearchResults').innerHTML = '';
      document.getElementById('apiSearchResults').classList.add('hidden');
      document.getElementById('apiSortRow').classList.add('hidden');
      document.getElementById('apiSortSelect').value = 'default';
      currentRawITunesResults = [];
    }

    window.openModal = function() {
      resetModalInputs();
      document.getElementById('modalTitle').textContent = '🎵 曲を登録';
      document.getElementById('resetSungRow').classList.add('hidden');
      document.getElementById('modal').classList.remove('hidden');
    };

    window.openEditModal = function(id) {
      const s = window.songs.find(x => x.id === id);
      if (!s) return;
      resetModalInputs();
      
      document.getElementById('editSongId').value = s.id;
      document.getElementById('modalTitle').textContent = '✏️ 曲を編集';
      document.getElementById('formTitle').value = s.title || '';
      document.getElementById('formArtist').value = s.artist || '';
      document.getElementById('formYear').value = s.year || '';
      document.getElementById('formGenre').value = s.genre || '';
      document.getElementById('formMaxPitch').value = s.maxPitch || '';
      document.getElementById('formMinPitch').value = s.minPitch || '';
      document.getElementById('formArtwork').value = s.artwork || '';
      document.getElementById('formPreviewUrl').value = s.previewUrl || '';
      document.getElementById('formDuration').value = s.duration || '';
      document.getElementById('formDurationMs').value = s.durationMs || 0;
      document.getElementById('formLastSungAt').value = s.lastSungAt || '';
      document.getElementById('formSingCount').value = s.singCount || 0;
      document.getElementById('formScoreVal').value = s.scoreVal || '';
      document.getElementById('formDuetType').value = s.duetType || 'solo';
      document.getElementById('formKey').value = s.key || '0';
      document.getElementById('formScore').value = s.score || '歌える';
      document.getElementById('formTags').value = (s.tags || []).join(', ');
      document.getElementById('formMemo').value = s.memo || '';
      
      const resetRow = document.getElementById('resetSungRow');
      if (s.lastSungAt || s.singCount) {
        resetRow.classList.remove('hidden');
      } else {
        resetRow.classList.add('hidden');
      }

      document.getElementById('modal').classList.remove('hidden');
    };

    window.clearSungHistory = function() {
      if (confirm('この曲の歌唱履歴と回数をクリアしますか？')) {
        document.getElementById('formLastSungAt').value = '';
        document.getElementById('formSingCount').value = '0';
        document.getElementById('resetSungRow').classList.add('hidden');
      }
    };

    window.closeModal = function() {
      document.getElementById('modal').classList.add('hidden');
    };

    window.handleSave = async function(e) {
      e.preventDefault();
      if (!window.firestoreOps) {
        alert("データベースに接続されていません。");
        return;
      }
      const editId = document.getElementById('editSongId').value;
      const tags = document.getElementById('formTags').value
        .split(/[\s,、]+/)
        .map(t => t.trim().replace(/^#/, ''))
        .filter(Boolean);

      const songData = {
        title: document.getElementById('formTitle').value,
        artist: document.getElementById('formArtist').value,
        year: document.getElementById('formYear').value,
        genre: document.getElementById('formGenre').value.trim(),
        maxPitch: document.getElementById('formMaxPitch').value.trim(),
        minPitch: document.getElementById('formMinPitch').value.trim(),
        artwork: document.getElementById('formArtwork').value,
        previewUrl: document.getElementById('formPreviewUrl').value,
        duration: document.getElementById('formDuration').value,
        durationMs: parseInt(document.getElementById('formDurationMs').value, 10) || 0,
        scoreVal: document.getElementById('formScoreVal').value ? parseFloat(document.getElementById('formScoreVal').value) : null,
        duetType: document.getElementById('formDuetType').value,
        key: document.getElementById('formKey').value,
        score: document.getElementById('formScore').value,
        tags: tags,
        memo: document.getElementById('formMemo').value,
        singCount: parseInt(document.getElementById('formSingCount').value, 10) || 0,
        lastSungAt: document.getElementById('formLastSungAt').value ? Number(document.getElementById('formLastSungAt').value) : null
      };

      const { collection, addDoc, doc, updateDoc } = window.firestoreOps;

      if (editId) {
        await updateDoc(doc(window.db, "songs", editId), songData);
      } else {
        await addDoc(collection(window.db, "songs"), {
          ...songData,
          createdAt: Date.now(),
          singCount: 0,
          lastSungAt: null
        });
      }
      closeModal();
    };

    window.deleteSong = async function(id) {
      if (confirm('この曲を削除しますか？')) {
        if (!window.firestoreOps) return;
        removeFromSetlist(id);
        const { doc, deleteDoc } = window.firestoreOps;
        await deleteDoc(doc(window.db, "songs", id));
      }
    };

    window.pickRandom = function() {
      let pool = (window.songs || []).filter(s => {
        const matchesGenre = selectedGenre ? s.genre === selectedGenre : true;
        const matchesTag = selectedTag ? s.tags && s.tags.includes(selectedTag) : true;
        const matchesScore = selectedScore === 'all' ? true : s.score === selectedScore;
        return matchesGenre && matchesTag && matchesScore;
      });
      if (pool.length === 0) pool = window.songs;
      if (!pool || pool.length === 0) return;

      const pick = pool[Math.floor(Math.random() * pool.length)];
      document.getElementById('randomTitle').textContent = pick.title;
      document.getElementById('randomArtist').textContent = pick.artist || '歌手未設定';
      document.getElementById('randomMeta').textContent = `${pick.year ? pick.year + '年 • ' : ''}${pick.genre || ''}${pick.maxPitch ? ' • 最高 ' + pick.maxPitch : ''}`;
      document.getElementById('randomKey').textContent = 'キー: ' + (pick.key === '0' ? '原曲キー' : pick.key);
      document.getElementById('randomBanner').classList.remove('hidden');
    };

    window.closeRandom = function() {
      document.getElementById('randomBanner').classList.add('hidden');
    };

    render();
  </script>
</body>
</html>
